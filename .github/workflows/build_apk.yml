name: Build & Package AIRLECHOO Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

jobs:
  build:
    name: 🚀 Build Android APKs
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🐹 Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 🔧 Install System Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xz-utils

      - name: 🌐 Sync Web UI Assets into Android Bundle
        run: |
          echo "Syncing latest Echoo Web UI assets into Android assets/web..."
          mkdir -p android/app/src/main/assets/web
          cp -r index.html manifest.json sw.js src assets android/app/src/main/assets/web/

      - name: 🔑 Ensure Release Signing Keystore
        run: |
          if [ ! -f "android/app/release.jks" ]; then
            echo "Generating release keystore for Android build..."
            keytool -genkey -v \
              -keystore android/app/release.jks \
              -alias antigem \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=Airlechoo, OU=Dev, O=Echoo, L=City, S=State, C=IN"
          fi

      - name: 🔐 Make Scripts Executable
        run: |
          chmod +x android/gradlew
          chmod +x scripts/*.sh || true
          chmod +x build_apk.sh || true

      - name: 🔨 Compile Android APKs
        working-directory: android
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'all' }}"
          echo "Target build type: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleTermuxDebug assembleStandardDebug --no-daemon --stacktrace
          elif [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleTermuxRelease assembleStandardRelease --no-daemon --stacktrace
          else
            # Build both debug and release
            ./gradlew assembleTermuxDebug assembleTermuxRelease assembleStandardDebug --no-daemon --stacktrace
          fi

      - name: 📦 Collect APK Artifacts
        run: |
          mkdir -p build_output
          echo "Finding all compiled APKs..."
          find android/app/build/outputs/apk/ -name "*.apk" -type f | while read -r apk; do
            filename=$(basename "$apk")
            dirname=$(basename "$(dirname "$apk")")
            parentdir=$(basename "$(dirname "$(dirname "$apk")")")
            target_name="AIRLECHOO-${parentdir}-${dirname}-${filename}"
            echo "Packaging: $apk -> build_output/$target_name"
            cp "$apk" "build_output/$target_name"
          done
          
          echo "=== Built Artifacts ==="
          ls -lh build_output/

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIRLECHOO-Android-APKs
          path: build_output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🏷️ Release to GitHub Releases (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
